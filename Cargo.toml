[workspace]
resolver = "2"
members = [
    "crates/gcp-orgmove-cli",
    "crates/gcp-orgmove-core",
    "crates/gcp-orgmove-gcp",
    "crates/gcp-orgmove-parity",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"
# Not published to crates.io for now: distributed as release binaries.
publish = false

[workspace.dependencies]
gcp-orgmove-core = { path = "crates/gcp-orgmove-core" }
gcp-orgmove-gcp = { path = "crates/gcp-orgmove-gcp" }
gcp-orgmove-parity = { path = "crates/gcp-orgmove-parity" }

# Official Google Cloud Rust SDK
google-cloud-auth = "1"
google-cloud-gax = "1"
google-cloud-wkt = "1"
google-cloud-type = "1"
google-cloud-rpc = "1"
bytes = "1"
google-cloud-longrunning = "1"
google-cloud-lro = "1"
google-cloud-logging-v2 = "1"
google-cloud-resourcemanager-v3 = "1"
google-cloud-asset-v1 = "1"
google-cloud-iam-v1 = "1"
google-cloud-iam-v2 = "1"
google-cloud-iam-admin-v1 = "1"
google-cloud-orgpolicy-v2 = "1"
google-cloud-policytroubleshooter-v1 = "1"
google-cloud-identity-accesscontextmanager-v1 = "1"
google-cloud-compute-v1 = { version = "4", default-features = false, features = ["default-rustls-provider", "projects", "firewall-policies"] }
# Plain HTTP for APIs the SDK does not cover (Cloud Identity Groups).
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
wiremock = "0.6"

comfy-table = "7"
indicatif = "0.17"
assert_cmd = "2"
predicates = "3"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
insta = { version = "1", features = ["json", "yaml"] }
tempfile = "3"
fs2 = "0.4"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Must stay "unwind": `apply` restores the org-policy constraints from a
# catch_unwind guard, which would be skipped by panic = "abort".
panic = "unwind"
